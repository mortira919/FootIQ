app = "footiq"
primary_region = "fra"

[env]
  FOOTIQ_DB = "/data/footiq.sqlite"

[[mounts]]
  source = "footiq_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # ponytail: SQLite на одном volume, поэтому машина одна; на Postgres можно масштабировать
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
